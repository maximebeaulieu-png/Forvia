<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Surfaces & ink</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--background)}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono);margin-top:6px;line-height:1.3}.sw{width:96px}.chip{height:52px;border-radius:var(--radius);border:1px solid var(--border)}.k{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#F7F8FC"></div><div class="lab">--background<br>#F7F8FC</div></div><div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="lab">--card<br>#FFFFFF</div></div><div class="sw"><div class="chip" style="background:#EFF1F9"></div><div class="lab">--muted<br>#EFF1F9</div></div><div class="sw"><div class="chip" style="background:#01003D"></div><div class="lab">--foreground<br>#01003D</div></div><div class="sw"><div class="chip" style="background:#575E86"></div><div class="lab">--muted-foreground<br>#575E86</div></div><div class="sw"><div class="chip" style="background:#E4E7F4"></div><div class="lab">--border<br>#E4E7F4</div></div></div></body></html>
