<!-- @dsCard group="Spacing" viewport="700x140" name="4-px scale" subtitle="Everything lands on a 4-px grid" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>4-px scale</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--background)}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono);margin-top:6px;line-height:1.3}.sw{width:96px}.chip{height:52px;border-radius:var(--radius);border:1px solid var(--border)}.k{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row" style="align-items:flex-end"><div style="text-align:center"><div style="width:4px;height:4px;background:var(--primary);border-radius:2px"></div><div class="lab">4</div></div><div style="text-align:center"><div style="width:8px;height:8px;background:var(--primary);border-radius:2px"></div><div class="lab">8</div></div><div style="text-align:center"><div style="width:12px;height:12px;background:var(--primary);border-radius:2px"></div><div class="lab">12</div></div><div style="text-align:center"><div style="width:16px;height:16px;background:var(--primary);border-radius:2px"></div><div class="lab">16</div></div><div style="text-align:center"><div style="width:20px;height:20px;background:var(--primary);border-radius:2px"></div><div class="lab">20</div></div><div style="text-align:center"><div style="width:24px;height:24px;background:var(--primary);border-radius:2px"></div><div class="lab">24</div></div><div style="text-align:center"><div style="width:32px;height:32px;background:var(--primary);border-radius:2px"></div><div class="lab">32</div></div><div style="text-align:center"><div style="width:40px;height:40px;background:var(--primary);border-radius:2px"></div><div class="lab">40</div></div><div style="text-align:center"><div style="width:48px;height:48px;background:var(--primary);border-radius:2px"></div><div class="lab">48</div></div></div></body></html>
