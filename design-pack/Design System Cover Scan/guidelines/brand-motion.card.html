<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Motion rules</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--background)}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono);margin-top:6px;line-height:1.3}.sw{width:96px}.chip{height:52px;border-radius:var(--radius);border:1px solid var(--border)}.k{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div style="display:grid;gap:10px;font-size:13px"><div><b style="font-weight:600">Stepper progression</b> <span class="k">200ms · ease-out · per step</span></div><div><b style="font-weight:600">Row recolour on profile switch</b> <span class="k">150ms · standard</span></div><div><b style="font-weight:600">Evidence pulse on click</b> <span class="k">300ms · once</span></div><div style="color:var(--muted-foreground)">prefers-reduced-motion disables all three; states still change.</div></div></body></html>
