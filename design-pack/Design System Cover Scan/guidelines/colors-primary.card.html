<!-- @dsCard group="Colors" viewport="700x150" name="Brand & accent" subtitle="FORVIA blue as the only brand colour; accent tint for hover and selected rows" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Brand & accent</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--background)}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono);margin-top:6px;line-height:1.3}.sw{width:96px}.chip{height:52px;border-radius:var(--radius);border:1px solid var(--border)}.k{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#0A23CA"></div><div class="lab">--primary<br>#0A23CA</div></div><div class="sw"><div class="chip" style="background:#8390E4"></div><div class="lab">--brand-light<br>#8390E4</div></div><div class="sw"><div class="chip" style="background:#01003D"></div><div class="lab">--brand-dark<br>#01003D</div></div><div class="sw"><div class="chip" style="background:#EAEDFB"></div><div class="lab">--accent<br>#EAEDFB</div></div><div class="sw"><div class="chip" style="background:#B3261E"></div><div class="lab">--destructive<br>#B3261E</div></div></div></body></html>
