<!-- @dsCard group="Spacing" viewport="700x140" name="Radii" subtitle="shadcn radius 0.375rem; pills only for chips and rating badges" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Radii</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--background)}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono);margin-top:6px;line-height:1.3}.sw{width:96px}.chip{height:52px;border-radius:var(--radius);border:1px solid var(--border)}.k{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row"><div class="sw"><div style="height:52px;background:var(--card);border:1px solid var(--border);border-radius:4px"></div><div class="lab">--radius-sm<br>4px</div></div><div class="sw"><div style="height:52px;background:var(--card);border:1px solid var(--border);border-radius:6px"></div><div class="lab">--radius<br>6px</div></div><div class="sw"><div style="height:52px;background:var(--card);border:1px solid var(--border);border-radius:8px"></div><div class="lab">--radius-lg<br>8px</div></div><div class="sw"><div style="height:52px;background:var(--card);border:1px solid var(--border);border-radius:9999px"></div><div class="lab">--radius-full<br>9999px</div></div></div></body></html>
