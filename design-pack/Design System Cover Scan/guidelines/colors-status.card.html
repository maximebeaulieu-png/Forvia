<!-- @dsCard group="Colors" viewport="700x190" name="Status palette" subtitle="The only chromatic vocabulary — always paired with an icon and a word" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Status palette</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--background)}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono);margin-top:6px;line-height:1.3}.sw{width:96px}.chip{height:52px;border-radius:var(--radius);border:1px solid var(--border)}.k{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row"><div style="width:150px"><div style="height:52px;border-radius:var(--radius);background:#E6F4EC;color:#1E7F4F;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;border:1px solid #1E7F4F22">Compliant</div><div class="lab">--status-go<br>#1E7F4F / #E6F4EC</div></div><div style="width:150px"><div style="height:52px;border-radius:var(--radius);background:#FFF3DF;color:#B26B00;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;border:1px solid #B26B0022">Request changes</div><div class="lab">--status-amber<br>#B26B00 / #FFF3DF</div></div><div style="width:150px"><div style="height:52px;border-radius:var(--radius);background:#FBE9E7;color:#B3261E;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;border:1px solid #B3261E22">Not admissible</div><div class="lab">--status-red<br>#B3261E / #FBE9E7</div></div><div style="width:150px"><div style="height:52px;border-radius:var(--radius);background:#EEE9FA;color:#5B3FA6;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;border:1px solid #5B3FA622">Needs review</div><div class="lab">--status-review<br>#5B3FA6 / #EEE9FA</div></div><div style="width:150px"><div style="height:52px;border-radius:var(--radius);background:#F1F2F4;color:#6B7280;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;border:1px solid #6B728022">Analysing…</div><div class="lab">--status-neutral<br>#6B7280 / #F1F2F4</div></div></div></body></html>
