<!-- @dsCard group="Colors" viewport="700x150" name="Dark surfaces" subtitle="Night theme for Group Insurance screens (screens 1 and 3 only)" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Dark surfaces</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--background)}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono);margin-top:6px;line-height:1.3}.sw{width:96px}.chip{height:52px;border-radius:var(--radius);border:1px solid var(--border)}.k{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:#05061C"></div><div class="lab">--background<br>#05061C</div></div><div class="sw"><div class="chip" style="background:#0D0F2B"></div><div class="lab">--card<br>#0D0F2B</div></div><div class="sw"><div class="chip" style="background:#212550"></div><div class="lab">--border<br>#212550</div></div><div class="sw"><div class="chip" style="background:#E8EAF8"></div><div class="lab">--foreground<br>#E8EAF8</div></div><div class="sw"><div class="chip" style="background:#8390E4"></div><div class="lab">--primary<br>#8390E4</div></div><div class="sw"><div class="chip" style="background:#3FBF7F"></div><div class="lab">--status-go<br>#3FBF7F</div></div></div></body></html>
