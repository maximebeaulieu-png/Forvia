<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Document semantics</title><link rel="stylesheet" href="../styles.css"><style>body{padding:16px;background:var(--background)}.row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}.lab{font-size:11px;color:var(--muted-foreground);font-family:var(--font-mono);margin-top:6px;line-height:1.3}.sw{width:96px}.chip{height:52px;border-radius:var(--radius);border:1px solid var(--border)}.k{font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}</style></head><body><div class="row" style="align-items:center;gap:24px">
<div style="width:220px"><div style="font-size:13px;line-height:1.5">Frais de retrait engagés par <span style="background:var(--evidence);padding:1px 2px">l'assuré 305.000 €</span></div><div class="lab">--evidence · #F5C451 @ 35%</div></div>
<div style="width:220px"><div style="position:relative;height:6px;background:var(--gap-track);border-radius:3px"><div style="position:absolute;inset:0 auto 0 0;width:2%;background:var(--gap-fill);border-radius:3px"></div><div style="position:absolute;right:0;top:-4px;width:2px;height:14px;background:var(--required-marker)"></div></div><div class="lab">--gap-fill · --required-marker</div></div>
</div></body></html>
