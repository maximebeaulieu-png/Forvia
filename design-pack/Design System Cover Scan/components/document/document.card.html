<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:16px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const { DocumentViewer, ProcessingStepper, ProfileSwitcher, MaskedText, Button, Icon } = window.CoverScanDesignSystem_6debdf;
function Demo(){
  const [profile,setProfile]=React.useState("gptc");
  const [page,setPage]=React.useState(2);
  const [active,setActive]=React.useState("recall");
  return <div>
    <div className="row">
      <ProfileSwitcher value={profile} onChange={setProfile} profiles={[
        {id:"gptc",label:"GPTC default",version:"v3",note:"PL €20M · recall and PFL €15M · stamp missing blocks"},
        {id:"expert",label:"Expert (R. Mekouar)",version:"v1",note:"Recall €5M accepted · stamp missing requests changes"}]}/>
      <MaskedText value="nicole.hoffmann@polyvlies.de"/>
      <Button size="sm" onClick={()=>{setPage(2);setActive(a=>a==="recall"?"pl":"recall")}} iconLeft={<Icon name="arrow-right" size={13}/>}>Pulse evidence</Button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 240px",gap:12,height:330}}>
      <DocumentViewer
        pages={[{n:1,imageUrl:"../../assets/pages/marron_mts_p1.jpeg",lang:"fr",ocrUsed:true},{n:2,imageUrl:"../../assets/pages/marron_mts_p2.jpeg",lang:"fr",ocrUsed:true}]}
        activePage={page} onPageChange={setPage} activeHighlightId={active}
        highlights={[{id:"recall",page:2,x:0.08,y:0.36,w:0.66,h:0.028},{id:"pl",page:2,x:0.08,y:0.30,w:0.66,h:0.028}]}
        fileName="MTS_MMA_2025.pdf"/>
      <div style={{border:"1px solid var(--border)",borderRadius:"var(--radius)",background:"var(--card)",padding:12,overflow:"auto"}}>
        <ProcessingStepper current={6} timings={[420,3100,900,6400,700,1500]}/>
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
